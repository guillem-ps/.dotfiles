name: Publish Obsidian Breeze

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Get current version
        id: version
        working-directory: obsidian-breeze
        run: echo "current=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        working-directory: obsidian-breeze
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        working-directory: obsidian-breeze
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.bump.outputs.new }}"
          PREV_VERSION="${{ steps.version.outputs.current }}"
          {
            echo "# Change Log"
            echo ""
            echo "## [$VERSION] - $DATE"
            echo "### Changed"
            echo "- Version bump: $PREV_VERSION → $VERSION"
            echo ""
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # TEMPORARY DEBUG STEP — remove once the Marketplace publisher member
      # has been added with the correct identity ID printed below.
      - name: Get Team Foundation identity id
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798

      - name: Publish to VS Code Marketplace
        working-directory: obsidian-breeze
        run: vsce publish --azure-credential

      # Only reached if publish above succeeded — a failed publish must not
      # leave a version bump / tag / commit behind with nothing published.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add obsidian-breeze/package.json obsidian-breeze/CHANGELOG.md
          git commit -m "chore: release obsidian-breeze v${{ steps.bump.outputs.new }}"
          git tag "obsidian-breeze-v${{ steps.bump.outputs.new }}"
          git push && git push --tags
