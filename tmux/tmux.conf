# ============================================
# Tmux configuration file
# ============================================

# ---- General Settings ----

# Set the default terminal to 256 colors with true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Set history limit
set -g history-limit 102400

# Start indexing windows and panes from 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Reduce escape timeout (faster response after prefix)
set -sg escape-time 1

# Don't rename windows automatically
set -g allow-rename off

# Enable focus events for applications running in tmux
set -g focus-events on

# Enable extended keys for modern terminals (ghostty, kitty, etc.)
set -g extended-keys on

# ---- Key Bindings ----

# Quick reload of tmux config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ---- Mouse Mode ----

set -g mouse on

# ---- Visual/Audio Settings ----

set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ---- Copy Mode (vi keys) ----

setw -g mode-keys vi

unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- Design Tweaks ----

# Clock mode
setw -g clock-mode-colour '#a8c48a'

# Copy mode
setw -g mode-style 'fg=white bg=#3d1f3a bold'

# Panes
set -g pane-border-style 'fg=#b56576'
set -g pane-active-border-style 'fg=#87a878'

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#b56576'

# Status left: show indicator when prefix is pressed
set -g status-left '#{?client_prefix,#[fg=#a8c48a],#[fg=#b56576]} '
set -g status-left-length 10

# Status right: date and time
set -g status-right-style 'fg=black bg=#87a878'
set -g status-right '#[bg=terminal fg=#87a878]#[bg=#87a878 fg=black]%Y-%m-%d %H:%M#[bg=terminal fg=#87a878]'

# Current window format
setw -g window-status-current-style 'fg=white bg=#b56576 bold'
setw -g window-status-current-format '#[bg=terminal fg=#b56576]#[bg=#b56576 fg=white]#I #W #F#[bg=terminal fg=#b56576]'

# Other windows
setw -g window-status-style 'fg=#b56576'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=white]#W #[fg=#a8c48a]#F '

# Window bell style
setw -g window-status-bell-style 'fg=#87a878 bg=#b56576 bold'

# Messages
set -g message-style 'fg=white bg=#3d1f3a bold'

# ---- Tmux Plugin Manager (TPM) ----

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

if "test ! -d ~/.tmux/plugins/tpm" \
       "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.tmux/plugins/tpm/tpm'

# Plugins:
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell ~/.tmux/plugins/tpm/tpm
